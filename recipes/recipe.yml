# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: tokimekios-pc
description: Proof of concept TokimekiOS PC environment based on Fedora Atomic 44 (KDE Kinoite)

base-image: ghcr.io/ublue-os/kinoite-main
image-version: 44 

modules:
  - type: files
    files:
      - source: system
        destination: / # Copies files/system/* into root / (branding, plasma configs, theme overrides)

  - type: dnf
    repos:
      copr:
        - atim/starship
        - papirus/papirus-icon-theme
    install:
      packages:
        # Shell & Utility
        - micro
        - starship
        - fastfetch
        - zsh
        # Tokimeki Liquid Glass / UI Essentials
        - kvantum                  # SVG-based theme engine for full blur/translucency support
        - kvantum-qt5
        - papirus-icon-theme        # Clean modern vector icons
        - plasma-workspace-wallpapers
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.kde.gwenview      # KDE native image viewer (fits Plasma better than Loupe)
          - org.kde.ark           # Archiving utility
      - scope: user

  - type: script
    scripts:
      - setup-tokimeki-ui.sh      # Custom script for compiling themes or setting defaults

  - type: signing
